<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>thumbnail</title>
<meta name="viewport" content="width=1280, height=720">
<!--
  サムネイル 1280x720
  入力: window.THUMB = {main:"メイン文字(10字以内)", sub:"サブ文字(20字以内)", icon:"lucide名"}
        または ?data=<URLエンコードしたJSON>（こちらが優先）。window.SCENE でも可。
  任意: ?theme=navy|black|green  ?font=noto|zen
  完了: document.body.dataset.ready = "1"
  右下（再生時間の表示位置）には要素を置かない。
-->
<link rel="stylesheet" href="shared/base.css">
<style>
  html, body { width: 1280px; height: 720px; }
  .canvas { background:
      radial-gradient(ellipse 55% 75% at 78% 46%, var(--bg-glow) 0%, transparent 70%),
      radial-gradient(ellipse 120% 110% at 40% 40%, var(--bg) 0%, var(--bg-deep) 100%); }
  .frame { position: absolute; inset: 22px; border: 1.5px solid var(--gold); pointer-events: none; }
  .frame::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--line); }

  .text { position: absolute; left: 84px; top: 70px; width: 720px; height: 560px;
          display: flex; flex-direction: column; justify-content: center; }
  .sub-box { width: 100%; flex: none; }
  .sub { display: block; max-width: 100%; white-space: nowrap; font-family: var(--font-sans); font-weight: 500;
         color: var(--ivory); letter-spacing: .06em; line-height: 1.35; }
  .bar { width: 120px; height: 3px; margin: 26px 0 20px; flex: none;
         background: linear-gradient(90deg, var(--gold), var(--gold-light) 50%, transparent); }
  .main-box { width: 100%; height: 400px; flex: none; display: flex; align-items: flex-start; }
  .main { display: block; width: 100%; font-family: var(--font-serif); font-weight: var(--w-display);
          line-height: 1.18; letter-spacing: .02em; text-wrap: balance; word-break: normal; word-break: auto-phrase;
          filter: drop-shadow(0 4px 14px rgba(0,0,0,.55)); }

  .medal { position: absolute; right: 92px; top: 150px; width: 380px; height: 380px; border-radius: 50%;
           border: 2px solid var(--gold); color: var(--gold); display: flex; align-items: center; justify-content: center; }
  .medal::before { content: ""; position: absolute; inset: 16px; border-radius: 50%; border: 1px solid var(--line); }
  .medal::after { content: ""; position: absolute; inset: -80px; border-radius: 50%; z-index: -1;
                  background: radial-gradient(circle, color-mix(in srgb, var(--gold) 20%, transparent) 0%, transparent 62%); }
  .medal svg { width: 210px; height: 210px; filter: drop-shadow(0 0 18px color-mix(in srgb, var(--gold) 35%, transparent)); }
</style>
</head>
<body>
<div class="canvas"></div>
<div class="frame"></div>
<div class="medal" id="medal"></div>
<div class="text">
  <div class="sub-box"><span class="sub" id="sub"></span></div>
  <div class="bar"></div>
  <div class="main-box"><div class="main gold-text" id="main"></div></div>
</div>

<script src="../assets/tokens.js"></script>
<script src="../assets/icons/lucide-icons.js"></script>
<script src="shared/runtime.js"></script>
<script>
(function () {
  var SAMPLE = { main: '1円玉は赤字', sub: 'お金持ちが知っている硬貨の雑学', icon: 'coins' };
  var d, TH = ZD.tokens.thumbnail || {}, TY = TH.type || {};

  function render() {
    d = ZD.loadData(['THUMB', 'SCENE'], SAMPLE);
    ZD.setup(Object.assign({}, d, { mode: 'regular' })); // サムネは常に通常モード
    document.getElementById('medal').innerHTML = ZD.icon(d.icon, { stroke: TH.iconStroke || 1.5 });
    document.getElementById('sub').textContent = d.sub || '';
    document.querySelector('.bar').style.display = d.sub ? '' : 'none';
    document.getElementById('main').innerHTML = ZD.esc(d.main || '').replace(/\n|\\n/g, '<br>'); // 改行は \n で指定可
  }

  function layout() {
    ZD.fit(document.getElementById('sub'), { max: TY.sub || 50, min: 28, maxLines: 1, box: document.querySelector('.sub-box') });
    ZD.fit(document.getElementById('main'), { max: TY.main || 168, min: TY.mainMin || 80, step: 4, maxLines: 2 });
  }

  ZD.run(render, layout);
})();
</script>
</body>
</html>
