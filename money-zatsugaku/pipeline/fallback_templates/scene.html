<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>scene (fallback)</title>
<style>
  :root { --bg:#0f1b2d; --bg2:#16294a; --gold:#e8c35a; --text:#f4f1e8; --sub:#a9b6cc; }
  body.sleep { --bg:#070b14; --bg2:#0d1526; --gold:#b49a55; --text:#c9c6bd; --sub:#6f7b8f; }
  html,body { margin:0; width:1920px; height:1080px; overflow:hidden; }
  body { background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg) 70%);
         color:var(--text); font-family:"Noto Sans CJK JP","IPAexGothic","IPAGothic",sans-serif; }
  .top { position:absolute; top:48px; left:72px; right:72px; display:flex; justify-content:space-between;
         font-size:30px; color:var(--sub); letter-spacing:.08em; }
  .idx b { color:var(--gold); font-size:44px; }
  /* 下部18%(194px)は字幕用に空ける */
  .main { position:absolute; top:130px; left:120px; right:120px; height:756px;
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:36px; }
  h1 { margin:0; font-size:84px; line-height:1.2; text-align:center; font-weight:700; }
  .visual { display:flex; align-items:center; justify-content:center; min-height:300px; }
  .num { font-size:180px; font-weight:700; color:var(--gold); }
  .cmp { display:flex; align-items:center; gap:60px; font-size:72px; font-weight:700; }
  .cmp .box { padding:36px 56px; border:4px solid var(--gold); border-radius:24px; min-width:360px; text-align:center; }
  .cmp .vs { color:var(--gold); font-size:56px; }
  .cap { font-size:44px; color:var(--sub); text-align:center; }
</style></head>
<body>
<div class="top"><div class="ch" id="ch"></div><div class="idx" id="idx"></div></div>
<div class="main"><h1 id="h"></h1><div class="visual" id="v"></div><div class="cap" id="cap"></div></div>
<script src="common.js"></script>
<script>
  const d = readData("SCENE"); const v = d.visual || {};
  if (d.mode === "sleep") document.body.classList.add("sleep");
  const gold = getComputedStyle(document.body).getPropertyValue("--gold").trim();
  document.getElementById("ch").textContent = d.channel || "";
  document.getElementById("idx").innerHTML = d.index ? `<b>${esc(d.index)}</b> / ${esc(d.total || "")}` : "";
  document.getElementById("h").textContent = d.heading || "";
  const box = document.getElementById("v");
  if (v.type === "number") box.innerHTML = `<div class="num">${esc(v.number)}</div>`;
  else if (v.type === "compare") box.innerHTML = `<div class="cmp"><div class="box">${esc((v.compare||{}).left)}</div><div class="vs">VS</div><div class="box">${esc((v.compare||{}).right)}</div></div>`;
  else box.innerHTML = iconSvg(v.icon, 300, gold);
  document.getElementById("cap").textContent = v.caption || "";
  markReady();
</script></body></html>
